name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Make icon (if app.png exists)
        shell: pwsh
        run: |
          if ((Test-Path app.png) -and -not (Test-Path app.ico)) { python make_icon.py }

      - name: Build app with PyInstaller
        shell: pwsh
        run: |
          $piArgs = @("--noconfirm","--clean","--windowed","--name","SmartOrganizer","--collect-all","pymupdf","--collect-data","docx")
          if (Test-Path app.ico) { $piArgs += @("--icon","app.ico","--add-data","app.ico;.") }
          pyinstaller @piArgs organizer_gui.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = "0.0.0"
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}".TrimStart("v") }
          New-Item installer_output -ItemType Directory -Force | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" installer.iss

      - name: Build portable zip
        shell: pwsh
        run: |
          Set-Content -Path dist\SmartOrganizer\portable.txt -Value "portable"
          tar -a -c -f installer_output\SmartOrganizer_Portable.zip -C dist SmartOrganizer

      - uses: actions/upload-artifact@v4
        with:
          name: SmartOrganizer-build
          path: installer_output/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer_output/SmartOrganizer_Setup.exe
            installer_output/SmartOrganizer_Portable.zip
          generate_release_notes: true
